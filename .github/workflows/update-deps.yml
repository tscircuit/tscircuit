name: Update Dependencies

on:
  schedule:
    - cron: "0 15 * * *" # 8 AM PT (15:00 UTC)
  workflow_dispatch: # Allow manual triggering

concurrency:
  group: dependency-updates
  cancel-in-progress: false

jobs:
  update-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Configure git
        run: |
          git config --global user.name "tscircuitbot"
          git config --global user.email "bot@tscircuit.com"

      - name: Update specific dependencies
        run: |
          bun run scripts/update-dependencies.ts

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Create dependency update PR
        if: steps.git-check.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN }}
          branch: update-daily-cli-dependencies
          title: "chore: update dependencies from released CLI"
          commit-message: "chore: update dependencies from released CLI"
          body: "Copies the exact core selected by the released CLI, then synchronizes its dependency specs."
          base: main
