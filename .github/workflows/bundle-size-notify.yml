name: Bundle Size Notifications

on:
  workflow_run:
    workflows: ["Bundle Size"]
    types: [completed]

# PR builds (including forks) never receive secrets or a write token. This
# separate workflow only reads numeric artifacts, using code from main.
permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  notify:
    if: >-
      github.event.workflow_run.conclusion != 'cancelled' &&
      (github.event.workflow_run.event == 'pull_request' ||
       (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check for completed size measurements
        id: artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo,
              run_id: context.payload.workflow_run.id,
            })
            core.setOutput('available', ['bundle-size-base', 'bundle-size-head'].every(
              name => artifacts.some(artifact => artifact.name === name && !artifact.expired)
            ))

      - uses: actions/checkout@v4
        if: steps.artifacts.outputs.available == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: steps.artifacts.outputs.available == 'true'
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        if: steps.artifacts.outputs.available == 'true'
        with:
          pattern: bundle-size-*
          merge-multiple: true
          path: measurements
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Update PR report and alert Slack on large increases
        if: steps.artifacts.outputs.available == 'true'
        run: node scripts/notify-bundle-size.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_BUNDLE_SIZE_ALERT_WEBHOOK_URL: ${{ secrets.SLACK_BUNDLE_SIZE_ALERT_WEBHOOK_URL }}
          SLACK_AUTOMERGE_ALERT_WEBHOOK_URL: ${{ secrets.SLACK_AUTOMERGE_ALERT_WEBHOOK_URL }}
