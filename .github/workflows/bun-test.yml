# Created using @tscircuit/plop (npm install -g @tscircuit/plop)
name: Bun Test

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    if: "${{ github.event_name != 'pull_request' || github.event.pull_request.title != 'chore: bump version' }}"
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install libvips development files
        run: sudo apt-get update && sudo apt-get install -y libvips-dev

      - name: Install dependencies
        run: bun install

      - name: Verify native image encoding
        run: |
          node -e 'require("sharp")({ create: { width: 1, height: 1, channels: 3, background: "white" } }).png().toBuffer().then(() => console.log("Native PNG encoding passed"))'
      
      - run: bun run build

      - name: Run tests
        run: bun test
